[build-system]
requires = ["cython", "setuptools >= 77.0.0", "cmake >= 3.14"]
build-backend = "setuptools.build_meta"

[project]
name = 'gencodegenes'
version = '1.2.0'
description = 'Package to load genes from GENCODE GTF files'
readme = 'README.md'
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = 'Jeremy McRae', email = 'jeremy.mcrae@gmail.com'}
]

dependencies = [
    'pyfaidx >= 0.5.8',
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.setuptools]
packages = [
    "gencodegenes"
]

[tool.setuptools.package-data]
gencodegenes = ['transcript.pxd', 'tx.h', 'tx.cpp', 'py.typed', '*.pyi']

[project.urls]
homepage = 'https://github.com/jeremymcrae/gencodegenes'
